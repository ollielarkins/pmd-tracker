CONFIG_LOG=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Sensors
CONFIG_SENSOR=y
CONFIG_SPI=y
CONFIG_ADXL372_MEASUREMENT_MODE=y
CONFIG_ADXL372_TRIGGER_NONE=y

# GNSS (u-blox M10 over UART, 10 Hz via fix-rate in the overlay)
CONFIG_GNSS=y
CONFIG_GNSS_REFERENCE_FRAME_WGS84=y

# Flash checkpoint
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# BLE sync
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PMD"
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
